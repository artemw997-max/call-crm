<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Лист контроля звонков — 100 звонков</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Caveat:wght@500;600&display=swap');
:root{--paper:#f3eadb;--paper2:#fbf7ef;--ink:#25231f;--muted:#817a6d;--line:#d7cbb9;--green:#6d8b69;--red:#c97968;--dark:#292824}
*{box-sizing:border-box} body{margin:0;color:var(--ink);font-family:'DM Sans',Arial,sans-serif;background:radial-gradient(circle at 15% 10%,#fffaf0 0 8%,transparent 35%),linear-gradient(135deg,#e9decd,#f7efe2 48%,#e4d8c6);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(#8f806c 0.55px,transparent .55px);background-size:5px 5px}
.wrap{max-width:1500px;margin:auto;padding:34px 28px 40px}.top{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;margin-bottom:22px}.brand h1{font-family:'Playfair Display',serif;font-size:clamp(38px,5vw,72px);line-height:.9;margin:0;letter-spacing:-2px}.brand h1 span{display:block;font-family:'Caveat',cursive;font-size:1.05em;color:#765b3b;font-weight:500;letter-spacing:0;margin-top:-2px}.motto{display:flex;gap:28px;align-items:end}.motto .small{font-size:12px;letter-spacing:3px;line-height:1.6;text-transform:uppercase}.script{font-family:'Caveat',cursive;font-size:29px;color:#8a765e;transform:rotate(-5deg)}
.controls{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:12px;margin-bottom:18px}.field,.btn{background:rgba(255,252,245,.68);border:1px solid var(--line);border-radius:12px;min-height:60px;padding:10px 14px;box-shadow:0 7px 20px rgba(72,53,31,.06)}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.3px;font-weight:700;margin-bottom:5px}.field input{border:0;background:transparent;font:600 18px 'DM Sans';outline:0;width:100%;color:var(--ink)}.btn{background:var(--dark);color:#f7efe2;border:0;padding:0 24px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(0,0,0,.18)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.block{background:rgba(255,252,245,.7);border:1px solid var(--line);border-radius:14px;padding:13px 13px 12px;box-shadow:0 7px 20px rgba(72,53,31,.055)}.blockhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.blocktitle{font-weight:800;font-size:17px}.blocktitle b{font-size:22px;margin-right:5px}.times{display:flex;gap:15px;font-size:11px;color:var(--muted)}.time-input{width:62px;border:0;border-bottom:1px solid var(--line);background:transparent;font:600 12px 'DM Sans';outline:0;color:var(--ink)}
.blockbody{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:14px}.table{border:1px solid var(--line);border-radius:8px;overflow:hidden}.tr{display:grid;grid-template-columns:42px 1fr 1fr 1fr;min-height:20px;border-bottom:1px solid #e2d8ca;align-items:center;font-size:10px}.tr:last-child{border-bottom:0}.tr>div{height:100%;display:flex;align-items:center;justify-content:center;border-right:1px solid #e2d8ca}.tr>div:last-child{border-right:0}.th{font-weight:700;min-height:25px;background:#eee6d9}.tr .num{justify-content:center}.check{appearance:none;width:12px;height:12px;border:1px solid #9b9387;border-radius:2px;background:#fffaf3;cursor:pointer;position:relative}.check:checked:after{content:'✓';position:absolute;left:1px;top:-4px;font-size:13px;font-weight:800}.interest:checked{border-color:var(--green);background:#edf3e9}.interest:checked:after{color:var(--green)}.no:checked{border-color:var(--red);background:#f8ece8}.no:checked:after{color:var(--red)}.summary{align-self:center}.summary h4{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}.sumline{display:flex;justify-content:space-between;font-size:10px;margin:7px 0;color:#4e493f}.sumline b{border-bottom:1px solid #9e9588;min-width:24px;text-align:right}.day{margin-top:13px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 1fr auto;align-items:center;background:rgba(255,252,245,.76);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 7px 20px rgba(72,53,31,.055)}.day-title{font-size:16px;font-weight:800;letter-spacing:1px}.big{font-size:38px;font-weight:800;line-height:1}.big span{font-size:16px;color:#a69b8a}.metric label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}.metric .count{font-size:24px;font-weight:800}.day-script{font:500 25px 'Caveat';color:#765b3b;transform:rotate(-4deg)}
@media(max-width:950px){.top{grid-template-columns:1fr}.motto{justify-content:space-between}.controls{grid-template-columns:1fr 1fr}.btn{min-height:60px}.grid{grid-template-columns:1fr}.day{grid-template-columns:1.4fr repeat(4,1fr);gap:12px}.day-script{display:none}}
@media(max-width:620px){.wrap{padding:20px 12px}.controls{grid-template-columns:1fr}.blockbody{grid-template-columns:1fr}.summary{display:none}.day{grid-template-columns:1fr 1fr 1fr}.day-title{grid-column:1/-1}.brand h1{font-size:45px}.motto .small{display:none}}
@media print{body{background:#f3eadb!important}.wrap{max-width:none;padding:12mm}.btn{display:none}.controls{grid-template-columns:1.2fr 1fr 1fr}.grid{gap:5mm}.block{break-inside:avoid;box-shadow:none}.day{break-inside:avoid;box-shadow:none}.check{print-color-adjust:exact;-webkit-print-color-adjust:exact}@page{size:A4 landscape;margin:8mm}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><h1>ЛИСТ КОНТРОЛЯ <span>звонков</span></h1></div><div class="motto"><div class="small">БОЛЬШИЕ<br>РЕЗУЛЬТАТЫ<br>НАЧИНАЮТСЯ<br>С ЗВОНКА</div><div class="script">Действуй сегодня</div></div></header>
<section class="controls"><div class="field"><label>Дата</label><input id="date" type="date"></div><div class="field"><label>Начало дня</label><input id="dayStart" type="time"></div><div class="field"><label>Конец дня</label><input id="dayEnd" type="time"></div><button class="btn" onclick="window.print()">⇩ &nbsp; СКАЧАТЬ PDF<br><small>за сегодня</small></button></section>
<main class="grid" id="blocks"></main>
<section class="day"><div class="day-title">◎ &nbsp; ИТОГ ДНЯ</div><div class="metric"><label>Звонков</label><div class="big" id="totalCalls">0 <span>/ 100</span></div></div><div class="metric"><label>Не дозвонился</label><div class="count" id="notReached">0</div></div><div class="metric"><label>Интерес / КП</label><div class="count" id="interest">0</div></div><div class="metric"><label>Неинтересно</label><div class="count" id="notInterested">0</div></div><div class="day-script">Всё получится!</div></section>
</div>
<script>
const KEY='call-control-100-v1';
const state=JSON.parse(localStorage.getItem(KEY)||'{}');
const blocks=document.getElementById('blocks');
function save(){state.date=document.getElementById('date').value;state.dayStart=document.getElementById('dayStart').value;state.dayEnd=document.getElementById('dayEnd').value;localStorage.setItem(KEY,JSON.stringify(state));update()}
function setVal(id,val){const el=document.getElementById(id);if(el){el.value=val||'';el.addEventListener('change',save)}}
setVal('date',state.date||new Date().toISOString().slice(0,10));setVal('dayStart',state.dayStart);setVal('dayEnd',state.dayEnd);
for(let b=0;b<10;b++){
 const from=b*10+1,to=from+9; const box=document.createElement('section');box.className='block';box.innerHTML=`<div class="blockhead"><div class="blocktitle"><b>${b+1}</b> БЛОК <span style="font-weight:500">(${from}–${to})</span></div><div class="times">◷ Начало: <input class="time-input bs" type="time"> ◷ Конец: <input class="time-input be" type="time"></div></div><div class="blockbody"><div class="table"><div class="tr th"><div>№</div><div>Не дозвонился</div><div>Интерес / КП</div><div>Неинтересно</div></div>${Array.from({length:10},(_,i)=>{let n=from+i;return `<div class="tr"><div class="num">${n}</div><div><input class="check nr" type="checkbox" data-n="${n}" data-type="nr"></div><div><input class="check interest" type="checkbox" data-n="${n}" data-type="interest"></div><div><input class="check no" type="checkbox" data-n="${n}" data-type="no"></div></div>`}).join('')}</div><div class="summary"><h4>ИТОГ БЛОКА:</h4><div class="sumline">Не дозвонился: <b class="snr">0</b></div><div class="sumline">Интерес / КП: <b class="si">0</b></div><div class="sumline">Неинтересно: <b class="sno">0</b></div></div></div>`;blocks.appendChild(box);
 const bt=state['b'+b]||{};box.querySelector('.bs').value=bt.start||'';box.querySelector('.be').value=bt.end||'';box.querySelector('.bs').onchange=()=>{state['b'+b]={...(state['b'+b]||{}),start:box.querySelector('.bs').value,end:box.querySelector('.be').value};save()};box.querySelector('.be').onchange=box.querySelector('.bs').onchange;
 box.querySelectorAll('.check').forEach(c=>{if(state[c.dataset.n+'_'+c.dataset.type])c.checked=true;c.addEventListener('change',()=>{const n=c.dataset.n;['nr','interest','no'].forEach(t=>{if(t!==c.dataset.type){state[n+'_'+t]=false}});state[n+'_'+c.dataset.type]=c.checked;save()})});
}
function update(){let nr=0,ins=0,no=0;for(let b=0;b<10;b++){const box=blocks.children[b];let a=0,c=0,d=0;box.querySelectorAll('.check').forEach(x=>{if(x.checked){if(x.dataset.type==='nr')a++;if(x.dataset.type==='interest')c++;if(x.dataset.type==='no')d++}});box.querySelector('.snr').textContent=a;box.querySelector('.si').textContent=c;box.querySelector('.sno').textContent=d;nr+=a;ins+=c;no+=d}document.getElementById('notReached').textContent=nr;document.getElementById('interest').textContent=ins;document.getElementById('notInterested').textContent=no;document.getElementById('totalCalls').innerHTML=(nr+ins+no)+' <span>/ 100</span>'}
update();
</script>
</body></html>
