const KEY='mobile-prozvon-v1';let currentFilter='all';let data={};let dbPromise=null;let activeRecorder=null;let activeId=null;let activeStream=null;
const $=id=>document.getElementById(id);function today(){return new Date().toISOString().slice(0,10)}function load(){const d=localStorage.getItem(KEY+'-'+$('date').value);data=d?JSON.parse(d):{};render();initAudio()}function save(){localStorage.setItem(KEY+'-'+$('date').value,JSON.stringify(data));updateStats()}function state(id){return data[id]||{result:'',comment:''}}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function card(r){const x=state(r.id);const done=!!x.result;if(currentFilter==='pending'&&done)return '';if(currentFilter==='nr'&&x.result!=='nr')return '';if(currentFilter==='kp'&&x.result!=='kp')return '';if(currentFilter==='ni'&&x.result!=='ni')return '';return `<article class="card ${done?'done':''}" id="card-${r.id}"><div class="num">ЗВОНОК №${r.id-1} · БАЗА №${r.id}</div><div class="name">${esc(r.name)}</div><div class="phone">${esc(r.phone)}</div><div class="links"><a class="action call" href="tel:${r.phone.replace(/[^+0-9]/g,'')}">📞 ПОЗВОНИТЬ</a><a class="action" href="${esc(r.url)}" target="_blank" rel="noopener">🌐 САЙТ</a></div>${r.analysis?`<div class="analysis"><b>Крючок из анализа</b>${esc(r.analysis)}</div>`:''}<div class="results"><label class="res nr ${x.result==='nr'?'on':''}"><input type="radio" name="r${r.id}" ${x.result==='nr'?'checked':''} onchange="setResult(${r.id},'nr')">НЕ ДОЗВОНИЛСЯ</label><label class="res kp ${x.result==='kp'?'on':''}"><input type="radio" name="r${r.id}" ${x.result==='kp'?'checked':''} onchange="setResult(${r.id},'kp')">КП</label><label class="res ni ${x.result==='ni'?'on':''}"><input type="radio" name="r${r.id}" ${x.result==='ni'?'checked':''} ${x.result==='ni'?'checked':''} onchange="setResult(${r.id},'ni')">НЕ ИНТЕРЕСНО</label></div><div class="comment"><textarea placeholder="Комментарий после разговора..." oninput="setComment(${r.id},this.value)">${esc(x.comment)}</textarea><div class="voice"><button id="voice-${r.id}" onclick="toggleRecording(${r.id},this)">🎙️ НАЧАТЬ ЗАПИСЬ</button><button onclick="clearResult(${r.id})">Сбросить результат</button></div><div id="audio-${r.id}" class="audio" style="display:none"></div></div><button class="next" onclick="nextCard(${r.id})">${r.id<100?'СЛЕДУЮЩИЙ КЛИЕНТ →':'ЗАВЕРШИТЬ ПРОЗВОН'}</button></article>`}
function render(){const list=companies.map(card).join('');$('list').innerHTML=list||'<div class="empty">В этом фильтре пока нет компаний.</div>';updateStats();initAudio()}
function setResult(id,result){data[id]={...(data[id]||{}),result};save();render();setTimeout(()=>document.getElementById('card-'+id)?.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function setComment(id,v){data[id]={...(data[id]||{}),comment:v};save()}
function clearResult(id){if(data[id])data[id].result='';save();render()}
function nextCard(id){const i=companies.findIndex(x=>x.id===id);const next=companies[i+1];if(next){document.getElementById('card-'+next.id)?.scrollIntoView({behavior:'smooth',block:'start'})}else window.scrollTo({top:0,behavior:'smooth'})}
function updateStats(){let vals=companies.map(x=>state(x.id));let done=vals.filter(x=>x.result).length,nr=vals.filter(x=>x.result==='nr').length,kp=vals.filter(x=>x.result==='kp').length,ni=vals.filter(x=>x.result==='ni').length;$('done').textContent=done;$('sdone').textContent=done;$('snr').textContent=nr;$('skp').textContent=kp;$('sni').textContent=ni;$('kp').textContent=kp;$('bar').style.width=(done/companies.length*100)+'%'}
function openDB(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('mobile-prozvon-audio',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('audio'))db.createObjectStore('audio')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}
async function putAudio(id,blob){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('audio','readwrite');tx.objectStore('audio').put(blob,$('date').value+'-'+id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getAudio(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('audio','readonly');const req=tx.objectStore('audio').get($('date').value+'-'+id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}
async function deleteAudio(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('audio','readwrite');tx.objectStore('audio').delete($('date').value+'-'+id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function supportedMime(){const types=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];return types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||''}
async function renderAudio(id){const box=$('audio-'+id);if(!box)return;const blob=await getAudio(id);if(!blob){box.style.display='none';box.innerHTML='';return}const url=URL.createObjectURL(blob);box.style.display='block';box.innerHTML=`<audio controls preload="metadata" src="${url}"></audio><div class="audio-actions"><button onclick="downloadAudio(${id})">⬇️ Скачать аудио</button><button onclick="removeAudio(${id})">🗑️ Удалить запись</button></div><div class="recording">Аудиозапись сохранена на этом устройстве</div>`}
async function downloadAudio(id){const blob=await getAudio(id);if(!blob)return;const ext=blob.type.includes('ogg')?'ogg':blob.type.includes('mp4')?'m4a':'webm';const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=`prozon_${$('date').value}_${id}.${ext}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function removeAudio(id){if(!confirm('Удалить аудиозапись этого разговора?'))return;await deleteAudio(id);renderAudio(id)}
async function toggleRecording(id,btn){if(activeRecorder){if(activeId===id){activeRecorder.stop();return}alert('Сначала завершите текущую запись.');return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){alert('Запись аудио этим браузером недоступна. Откройте страницу по HTTPS в современном Chrome/Edge/Safari.');return}try{activeStream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=supportedMime();activeRecorder=mime?new MediaRecorder(activeStream,{mimeType:mime}):new MediaRecorder(activeStream);activeId=id;const chunks=[];btn.textContent='⏹️ ОСТАНОВИТЬ ЗАПИСЬ';btn.style.background='var(--red)';btn.style.color='#fff';btn.style.borderColor='var(--red)';activeRecorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};activeRecorder.onerror=()=>{alert('Ошибка записи аудио.');finishRecordingUI(btn)};activeRecorder.onstop=async()=>{const blob=new Blob(chunks,{type:activeRecorder.mimeType||mime||'audio/webm'});await putAudio(id,blob);finishRecordingUI(btn);await renderAudio(id)};activeRecorder.start()}catch(e){alert('Не удалось включить микрофон. Разрешите доступ к микрофону для этой страницы.');finishRecordingUI(btn)}}
function finishRecordingUI(btn){if(btn){btn.textContent='🎙️ НАЧАТЬ ЗАПИСЬ';btn.style.background='';btn.style.color='';btn.style.borderColor=''}if(activeStream){activeStream.getTracks().forEach(t=>t.stop());activeStream=null}activeRecorder=null;activeId=null}
function printPDF(){window.print()}
async function clearDay(){if(!confirm('Сбросить результаты и аудиозаписи за '+$('date').value+'?'))return;data={};localStorage.removeItem(KEY+'-'+$('date').value);try{for(const c of companies)await deleteAudio(c.id)}catch(e){}render()}
async function initAudio(){try{await openDB();for(const c of companies)await renderAudio(c.id)}catch(e){console.warn('Audio storage unavailable',e)}}
