<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171714">
<title>Мобильный прозвон — 99 компаний</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1eadf;color:#292724;font-family:Arial,sans-serif}.app{max-width:560px;margin:auto;padding:14px 12px 90px}.top{position:sticky;top:0;z-index:5;background:#f1eadfee;backdrop-filter:blur(10px);padding:6px 0 12px}.title{font-size:26px;font-weight:900}.sub{color:#7d7469;font-size:12px;margin-top:3px}.progress{margin-top:10px;height:8px;background:#dcd2c4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#63825f}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.count{background:#fffaf2;border:1px solid #d8cbb9;border-radius:10px;padding:8px;text-align:center}.count b{display:block;font-size:18px}.count small{font-size:9px;color:#81786a}.filters{display:flex;gap:6px;overflow:auto;margin:10px 0}.filters button{border:1px solid #d8cbb9;background:#fffaf2;border-radius:999px;padding:8px 11px;font-weight:800;white-space:nowrap}.filters button.active{background:#292724;color:#fff}.card{background:#fffaf2;border:1px solid #d8cbb9;border-radius:18px;padding:16px;box-shadow:0 8px 24px #48351f12}.num{font-size:11px;color:#81786a;font-weight:800}.company{font-size:24px;font-weight:900;line-height:1.05;margin:5px 0 10px}.phone{font-size:19px;font-weight:800}.links{display:flex;gap:8px;margin:12px 0}.links a{flex:1;text-decoration:none;text-align:center;border:1px solid #d8cbb9;border-radius:11px;padding:11px;color:#292724;font-weight:800;background:#f6efe4}.call{display:block;background:#63825f;color:white;text-decoration:none;text-align:center;border-radius:13px;padding:16px;font-size:19px;font-weight:900;margin:10px 0 14px}.label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#81786a;font-weight:900;margin:10px 0 7px}.results{display:grid;grid-template-columns:1fr;gap:7px}.result{display:flex;align-items:center;gap:9px;border:1px solid #d8cbb9;border-radius:11px;padding:12px;background:#fff}.result input{width:21px;height:21px}.result span{font-weight:800}.hook{background:#eee6d9;border-radius:11px;padding:11px;font-size:12px;line-height:1.4}.comment{width:100%;min-height:82px;border:1px solid #d8cbb9;border-radius:11px;padding:10px;font:15px Arial;resize:vertical;background:#fff}.voice{width:100%;border:0;border-radius:11px;padding:13px;background:#292724;color:#fff;font-size:15px;font-weight:900;margin-top:7px}.voice.listening{background:#b05a48}.next{width:100%;border:0;border-radius:13px;padding:16px;background:#292724;color:#fff;font-size:17px;font-weight:900;margin-top:12px}.prev{width:100%;border:1px solid #d8cbb9;border-radius:13px;padding:12px;background:#fffaf2;font-weight:800;margin-top:7px}.status{font-size:11px;color:#81786a;text-align:center;margin-top:7px;min-height:15px}.footer{margin-top:14px;color:#81786a;font-size:10px;text-align:center}@media(min-width:700px){body{padding-top:15px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="title">МОБИЛЬНЫЙ ПРОЗВОН</div><div class="sub">99 компаний · звонок → результат → комментарий</div><div class="progress"><i id="bar"></i></div><div class="counts"><div class="count"><b id="done">0</b><small>обработано</small></div><div class="count"><b id="kp">0</b><small>КП</small></div><div class="count"><b id="nr">0</b><small>не дозвон</small></div><div class="count"><b id="ni">0</b><small>не интересно</small></div></div></header>
<div class="filters"><button class="active" data-filter="all">Все</button><button data-filter="new">Осталось</button><button data-filter="kp">КП</button><button data-filter="nr">Не дозвонился</button><button data-filter="ni">Не интересно</button></div>
<main id="card"></main><div class="footer">Данные сохраняются в браузере телефона · голосовой ввод работает через Web Speech API, если браузер его поддерживает.</div>
</div>
<script>
const companies = [
__COMPANIES__
];
let state=JSON.parse(localStorage.getItem('mobileProzvonState')||'{}');let index=Number(localStorage.getItem('mobileProzvonIndex')||0);let filter='all';let recognition=null;let listening=false;
function save(){localStorage.setItem('mobileProzvonState',JSON.stringify(state));localStorage.setItem('mobileProzvonIndex',index);}
function stats(){let vals=Object.values(state),done=vals.filter(x=>x.result).length,kp=vals.filter(x=>x.result==='kp').length,nr=vals.filter(x=>x.result==='nr').length,ni=vals.filter(x=>x.result==='ni').length;document.getElementById('done').textContent=done;document.getElementById('kp').textContent=kp;document.getElementById('nr').textContent=nr;document.getElementById('ni').textContent=ni;document.getElementById('bar').style.width=(done/companies.length*100)+'%';}
function filtered(){return companies.map((c,i)=>({c,i})).filter(x=>filter==='all'||(filter==='new'&&!state[x.i]?.result)||state[x.i]?.result===filter);}
function render(){stats();let list=filtered();if(!list.length){document.getElementById('card').innerHTML='<div class="card"><div class="company">В этом фильтре пусто</div><button class="next" onclick="setFilter(\'all\')">Показать всех</button></div>';return;}if(!list.some(x=>x.i===index))index=list[0].i;let c=companies[index],s=state[index]||{};document.getElementById('card').innerHTML=`<section class="card"><div class="num">ЗВОНОК №${index+1} ИЗ ${companies.length}</div><div class="company">${esc(c.name)}</div><div class="phone">${esc(c.phone||'Телефон не указан')}</div><div class="links">${c.phone?`<a href="tel:${tel(c.phone)}">📞 Позвонить</a>`:''}${c.website?`<a href="${safeUrl(c.website)}" target="_blank" rel="noopener">🌐 Сайт</a>`:''}</div>${c.hook?`<div class="hook"><b>Крючок из анализа:</b><br>${esc(c.hook)}</div>`:''}<div class="label">Результат звонка</div><div class="results">${res('nr','Не дозвонился',s.result)}${res('kp','КП',s.result)}${res('ni','Не интересно',s.result)}</div><div class="label">Комментарий</div><textarea id="comment" class="comment" placeholder="Можно написать или надиктовать...">${esc(s.comment||'')}</textarea><button class="voice" id="voice" onclick="voice()">🎙️ Надиктовать комментарий</button><div class="status" id="status"></div><button class="next" onclick="next()">СЛЕДУЮЩИЙ КЛИЕНТ →</button><button class="prev" onclick="prev()">← Предыдущий</button></section>`;}
function res(v,t,cur){return `<label class="result"><input type="radio" name="result" ${cur===v?'checked':''} onchange="setResult('${v}')"><span>${t}</span></label>`}
function setResult(v){state[index]=state[index]||{};state[index].result=v;save();stats();}
function next(){saveComment();let list=filtered(),pos=list.findIndex(x=>x.i===index);index=list[(pos+1)%list.length]?.i??index;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function prev(){saveComment();let list=filtered(),pos=list.findIndex(x=>x.i===index);index=list[(pos-1+list.length)%list.length]?.i??index;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function saveComment(){let el=document.getElementById('comment');if(el){state[index]=state[index]||{};state[index].comment=el.value;save();}}
function setFilter(f){saveComment();filter=f;document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));render();}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>setFilter(b.dataset.filter));
function voice(){let btn=document.getElementById('voice'),ta=document.getElementById('comment'),status=document.getElementById('status');if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){ta.focus();status.textContent='Голосовой ввод не поддерживается этим браузером. Используй микрофон на клавиатуре телефона.';return;}if(listening){recognition.stop();return;}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='ru-RU';recognition.continuous=false;recognition.interimResults=true;let base=ta.value.trim();recognition.onstart=()=>{listening=true;btn.classList.add('listening');btn.textContent='⏹️ Слушаю… скажи комментарий';status.textContent='Говори — текст появится в поле ниже.'};recognition.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;if(e.results[e.results.length-1].isFinal){ta.value=(base?base+' ':'')+text;saveComment();}};recognition.onerror=e=>{status.textContent='Не удалось распознать голос: '+e.error+'. Можно использовать диктовку клавиатуры.'};recognition.onend=()=>{listening=false;btn.classList.remove('listening');btn.textContent='🎙️ Надиктовать комментарий';saveComment();};recognition.start();}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}function tel(x){return String(x).replace(/[^+\d]/g,'')}function safeUrl(x){let u=String(x).trim();if(!/^https?:\/\//i.test(u))u='https://'+u;return esc(u)}
render();
</script>
</body></html>
