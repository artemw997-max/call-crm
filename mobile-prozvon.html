<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171714"><title>Мобильный прозвон — 99 компаний</title><style>*{box-sizing:border-box}body{margin:0;background:#f1eadf;color:#292724;font-family:Arial,sans-serif}.app{max-width:560px;margin:auto;padding:14px 12px 90px}.top{position:sticky;top:0;z-index:5;background:#f1eadfee;backdrop-filter:blur(10px);padding:6px 0 12px}.title{font-size:26px;font-weight:900}.sub{color:#7d7469;font-size:12px;margin-top:3px}.progress{margin-top:10px;height:8px;background:#dcd2c4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#63825f}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.count{background:#fffaf2;border:1px solid #d8cbb9;border-radius:10px;padding:8px;text-align:center}.count b{display:block;font-size:18px}.count small{font-size:9px;color:#81786a}.filters{display:flex;gap:6px;overflow:auto;margin:10px 0}.filters button{border:1px solid #d8cbb9;background:#fffaf2;border-radius:999px;padding:8px 11px;font-weight:800;white-space:nowrap}.filters button.active{background:#292724;color:#fff}.card{background:#fffaf2;border:1px solid #d8cbb9;border-radius:18px;padding:16px;box-shadow:0 8px 24px #48351f12}.num{font-size:11px;color:#81786a;font-weight:800}.company{font-size:24px;font-weight:900;line-height:1.05;margin:5px 0 10px}.phone{font-size:19px;font-weight:800}.links{display:flex;gap:8px;margin:12px 0}.links a{flex:1;text-decoration:none;text-align:center;border:1px solid #d8cbb9;border-radius:11px;padding:11px;color:#292724;font-weight:800;background:#f6efe4}.call{display:block;background:#63825f;color:white;text-decoration:none;text-align:center;border-radius:13px;padding:16px;font-size:19px;font-weight:900;margin:10px 0 14px}.label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#81786a;font-weight:900;margin:10px 0 7px}.results{display:grid;grid-template-columns:1fr;gap:7px}.result{display:flex;align-items:center;gap:9px;border:1px solid #d8cbb9;border-radius:11px;padding:12px;background:#fff}.result input{width:21px;height:21px}.result span{font-weight:800}.hook{background:#eee6d9;border-radius:11px;padding:11px;font-size:12px;line-height:1.4}.comment{width:100%;min-height:82px;border:1px solid #d8cbb9;border-radius:11px;padding:10px;font:15px Arial;resize:vertical;background:#fff}.voice{width:100%;border:0;border-radius:11px;padding:13px;background:#292724;color:#fff;font-size:15px;font-weight:900;margin-top:7px}.voice.listening{background:#b05a48}.next{width:100%;border:0;border-radius:13px;padding:16px;background:#292724;color:#fff;font-size:17px;font-weight:900;margin-top:12px}.prev{width:100%;border:1px solid #d8cbb9;border-radius:13px;padding:12px;background:#fffaf2;font-weight:800;margin-top:7px}.status{font-size:11px;color:#81786a;text-align:center;margin-top:7px;min-height:15px}.footer{margin-top:14px;color:#81786a;font-size:10px;text-align:center}@media(min-width:700px){body{padding-top:15px}}</style></head><body><div class="app"><header class="top"><div class="title">МОБИЛЬНЫЙ ПРОЗВОН</div><div class="sub">99 компаний · звонок → результат → комментарий</div><div class="progress"><i id="bar"></i></div><div class="counts"><div class="count"><b id="done">0</b><small>обработано</small></div><div class="count"><b id="kp">0</b><small>КП</small></div><div class="count"><b id="nr">0</b><small>не дозвон</small></div><div class="count"><b id="ni">0</b><small>не интересно</small></div></div></header><div class="filters"><button class="active" data-filter="all">Все</button><button data-filter="new">Осталось</button><button data-filter="kp">КП</button><button data-filter="nr">Не дозвонился</button><button data-filter="ni">Не интересно</button></div><main id="card"></main><div class="footer">Данные сохраняются в браузере телефона · голосовой ввод использует Web Speech API, если он доступен.</div></div><script>
const companies=__COMPANIES__;
let state=JSON.parse(localStorage.getItem('mobileProzvonState')||'{}'),index=Number(localStorage.getItem('mobileProzvonIndex')||0),filter='all',recognition=null,listening=false;
function save(){localStorage.setItem('mobileProzvonState',JSON.stringify(state));localStorage.setItem('mobileProzvonIndex',index)}
function stats(){let v=Object.values(state),d=v.filter(x=>x.result).length,k=v.filter(x=>x.result==='kp').length,n=v.filter(x=>x.result==='nr').length,i=v.filter(x=>x.result==='ni').length;done.textContent=d;kp.textContent=k;nr.textContent=n;ni.textContent=i;bar.style.width=d/companies.length*100+'%'}
function filtered(){return companies.map((c,i)=>({c,i})).filter(x=>filter==='all'||filter==='new'&&!state[x.i]?.result||state[x.i]?.result===filter)}
function render(){stats();let l=filtered();if(!l.length){card.innerHTML='<div class="card"><div class="company">В этом фильтре пусто</div><button class="next" onclick="setFilter(\'all\')">Показать всех</button></div>';return}if(!l.some(x=>x.i===index))index=l[0].i;let c=companies[index],s=state[index]||{};card.innerHTML=`<section class="card"><div class="num">ЗВОНОК №${index+1} ИЗ ${companies.length} · ИСХОДНЫЙ №${c.source_no}</div><div class="company">${esc(c.name)}</div><div class="phone">${esc(c.phone||'Телефон не указан')}</div><div class="links">${c.phone?`<a href="tel:${tel(c.phone)}">📞 ПОЗВОНИТЬ</a>`:''}${c.website?`<a href="${safeUrl(c.website)}" target="_blank" rel="noopener">🌐 САЙТ</a>`:''}</div>${c.hook?`<div class="hook"><b>Крючок из анализа:</b><br>${esc(c.hook)}</div>`:''}<div class="label">Результат звонка</div><div class="results">${res('nr','Не дозвонился',s.result)}${res('kp','КП',s.result)}${res('ni','Не интересно',s.result)}</div><div class="label">Комментарий</div><textarea id="comment" class="comment" placeholder="Можно написать или надиктовать...">${esc(s.comment||'')}</textarea><button class="voice" id="voice" onclick="voice()">🎙️ НАДИКТОВАТЬ КОММЕНТАРИЙ</button><div class="status" id="status"></div><button class="next" onclick="next()">СЛЕДУЮЩИЙ КЛИЕНТ →</button><button class="prev" onclick="prev()">← Предыдущий</button></section>`}
function res(v,t,cur){return `<label class="result"><input type="radio" name="result" ${cur===v?'checked':''} onchange="setResult('${v}')"><span>${t}</span></label>`}
function setResult(v){state[index]=state[index]||{};state[index].result=v;save();stats()}
function saveComment(){let e=document.getElementById('comment');if(e){state[index]=state[index]||{};state[index].comment=e.value;save()}}
function next(){saveComment();let l=filtered(),p=l.findIndex(x=>x.i===index);index=l[(p+1)%l.length]?.i??index;save();render();scrollTo({top:0,behavior:'smooth'})}
function prev(){saveComment();let l=filtered(),p=l.findIndex(x=>x.i===index);index=l[(p-1+l.length)%l.length]?.i??index;save();render();scrollTo({top:0,behavior:'smooth'})}
function setFilter(f){saveComment();filter=f;document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));render()}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>setFilter(b.dataset.filter));
function voice(){let btn=document.getElementById('voice'),ta=document.getElementById('comment'),status=document.getElementById('status');let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){ta.focus();status.textContent='Встроенное распознавание недоступно. Нажми 🎙️ на клавиатуре телефона — диктовка тоже попадёт в это поле.';return}if(listening){recognition.stop();return}recognition=new SR();recognition.lang='ru-RU';recognition.continuous=false;recognition.interimResults=true;let base=ta.value.trim();recognition.onstart=()=>{listening=true;btn.classList.add('listening');btn.textContent='⏹️ СЛУШАЮ… ГОВОРИ';status.textContent='Говори комментарий, после паузы запись завершится.'};recognition.onresult=e=>{let text='';for(let j=e.resultIndex;j<e.results.length;j++)text+=e.results[j][0].transcript;if(e.results[e.results.length-1].isFinal){ta.value=(base?base+' ':'')+text;saveComment()}};recognition.onerror=e=>{status.textContent='Ошибка микрофона: '+e.error+'. Проверь разрешение микрофона.'};recognition.onend=()=>{listening=false;btn.classList.remove('listening');btn.textContent='🎙️ НАДИКТОВАТЬ КОММЕНТАРИЙ';saveComment()};recognition.start()}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function tel(x){return String(x).replace(/[^+\d]/g,'')}function safeUrl(x){let u=String(x).trim();if(!/^https?:\/\//i.test(u))u='https://'+u;return esc(u)}render();
</script></body></html>
